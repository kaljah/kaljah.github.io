name: E2E Browser Testing Matrix (Playwright)

# Tier 1 (smoke, ~21 tests) runs on every push to main and every pull request. It seeds its own
# data in CI: scripts/seed_e2e_user.py creates the "a"/"a" test sign-in (refuses to run in production)
# and seed_showcase_data.py loads sample data, then generate_storage_state.js saves the login.
# Tier 2 (the 139-test matrix) is manual only: its specs also need the itadmin/operator accounts and
# local seed scripts that CI does not create yet. See docs/hardening-plan.md.
on:
  pull_request:
    branches:
      - main
      - master
  push:
    branches:
      - main
      - master
  workflow_dispatch:
    inputs:
      test_tier:
        description: "Testing Tier to execute"
        required: true
        default: "smoke"
        type: choice
        options:
          - smoke
          - full

jobs:
  # ─────────────────────────────────────────────────────────────────────────────
  # TIER 1: Critical-Path E2E Smoke Tests (~15 core journey tests)
  # Runs on every Pull Request to ensure fast PR gating without delays (< 3 mins).
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-smoke:
    name: "Tier 1: Critical-Path E2E Smoke (~15 Tests)"
    if: github.event_name == 'pull_request' || github.event_name == 'push' || (github.event_name == 'workflow_dispatch' && inputs.test_tier == 'smoke')
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: new/server/requirements.txt

      - name: Install backend dependencies
        run: pip install -r new/server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: new/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: new/client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: new/client
        run: npx playwright install chromium --with-deps

      - name: Seed E2E data (test sign-in and sample data)
        working-directory: new/server
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-e2e-secret-key-not-for-production"
        run: |
          python scripts/seed_e2e_user.py
          python seed_showcase_data.py

      - name: Start Flask Backend Daemon
        working-directory: new/server
        env:
          FLASK_ENV: testing
          SEED_ADMIN: "true"
          SECRET_KEY: "ci-e2e-secret-key-not-for-production"
          RATELIMIT_ENABLED: "false"
          DISABLE_OUTBOUND_EMAIL: "true"
        run: |
          python app.py &
          for i in {1..30}; do
            curl -s http://127.0.0.1:5000/api/health && break
            echo "Waiting for Flask server on :5000... ($i/30)"
            sleep 1
          done

      - name: Start Vite Frontend Server
        working-directory: new/client
        env:
          VITE_API_URL: "http://127.0.0.1:5000/api"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:5173 && break
            echo "Waiting for Vite server on :5173... ($i/30)"
            sleep 1
          done

      - name: Create saved login for Playwright
        working-directory: new/client
        env:
          E2E_BASE_URL: "http://127.0.0.1:5173"
        run: node generate_storage_state.js

      - name: Run E2E Smoke Test Suite
        working-directory: new/client
        env:
          CI: "true"
          E2E_BASE_URL: "http://127.0.0.1:5173"
        run: npm run e2e:smoke

      - name: Upload Playwright Smoke Report Artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-smoke-report
          path: new/client/playwright-report/
          retention-days: 14

  # ─────────────────────────────────────────────────────────────────────────────
  # TIER 2: Comprehensive 19-Suite Matrix (139 Tests)
  # Runs on push to main/master, nightly schedule, or manual workflow dispatch.
  # ─────────────────────────────────────────────────────────────────────────────
  e2e-full-matrix:
    name: "Tier 2: Full 19-Suite Matrix (139 Tests)"
    if: github.event_name == 'workflow_dispatch' && inputs.test_tier == 'full'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: new/server/requirements.txt

      - name: Install backend dependencies
        run: pip install -r new/server/requirements.txt

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: "npm"
          cache-dependency-path: new/client/package-lock.json

      - name: Install frontend dependencies
        working-directory: new/client
        run: npm ci

      - name: Install Playwright Chromium
        working-directory: new/client
        run: npx playwright install chromium --with-deps

      - name: Start Flask Backend Daemon
        working-directory: new/server
        env:
          FLASK_ENV: testing
          SEED_ADMIN: "true"
          SECRET_KEY: "ci-e2e-secret-key-not-for-production"
          RATELIMIT_ENABLED: "false"
          DISABLE_OUTBOUND_EMAIL: "true"
        run: |
          python app.py &
          for i in {1..30}; do
            curl -s http://127.0.0.1:5000/api/health && break
            echo "Waiting for Flask server on :5000... ($i/30)"
            sleep 1
          done

      - name: Start Vite Frontend Server
        working-directory: new/client
        env:
          VITE_API_URL: "http://127.0.0.1:5000/api"
        run: |
          npm run dev -- --host 127.0.0.1 --port 5173 &
          for i in {1..30}; do
            curl -s http://127.0.0.1:5173 && break
            echo "Waiting for Vite server on :5173... ($i/30)"
            sleep 1
          done

      - name: Run Full 19-Suite E2E Matrix (139 Tests)
        working-directory: new/client
        env:
          CI: "true"
          E2E_BASE_URL: "http://127.0.0.1:5173"
        run: npm run e2e:full

      - name: Upload Playwright Full Report & Artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-full-report
          path: new/client/playwright-report/
          retention-days: 30
