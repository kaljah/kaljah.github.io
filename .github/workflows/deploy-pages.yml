name: Deploy Frontend to GitHub Pages

on:
  push:
    branches:
      - main
      - master
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Determine Base Path and Build
        env:
          # VITE_API_URL can be configured in GitHub Repo Settings -> Secrets/Variables -> Actions
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://ghg-accounting.onrender.com/api' }}
        run: |
          # If the repository is a user site (<owner>.github.io), base is '/'
          # If it is a project repository, base is '/<repo-name>/'
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Building with VITE_BASE_PATH=$VITE_BASE_PATH"
          echo "Building with VITE_API_URL=$VITE_API_URL"
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: new/client/dist

  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
