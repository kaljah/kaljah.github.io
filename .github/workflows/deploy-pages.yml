name: Build, Test & Deploy

on:
  push:
    branches:
      - main
      - master
  pull_request:
    branches:
      - main
      - master
  workflow_dispatch:

# Least privilege: only the deploy job gets the Pages / OIDC write scopes.
permissions:
  contents: read

# One run per branch / PR; a new push cancels that ref's older run only. (A single global
# "pages" group with cancel-in-progress let any PR push cancel a running main deploy.)
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 1: Backend Tests & Calculation Validation
  # Runs on every push and PR. Frontend deploy is blocked until this passes.
  # ─────────────────────────────────────────────────────────────────────────────
  backend-tests:
    name: Backend Tests & Calculation Validation
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: new/server

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"
          cache-dependency-path: new/server/requirements.txt

      - name: Install backend dependencies
        run: pip install -r requirements.txt pytest pytest-timeout hypothesis

      - name: Reject tracked machine-local and generated files
        working-directory: .
        run: |
          bad=$(git ls-files | grep -E '^(brain|annotations|conversations|builtin|mcp|bin)/|\.rar$|\.log$|\.db$|^graphify-out/' || true)
          if [ -n "$bad" ]; then
            echo "These files must not be tracked (see .gitignore):"
            echo "$bad"
            exit 1
          fi

      - name: Backend module size ratchet
        run: python scripts/loc_ratchet.py --check

      - name: Run full backend test suite
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SEED_ADMIN: "false"
          RATELIMIT_ENABLED: "false"
        run: |
          python -m pytest tests/ \
            --tb=short \
            -q \
            --no-header \
            -x \
            --timeout=300
        timeout-minutes: 15

      - name: Run GHG calculation differential validation
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SEED_ADMIN: "false"
        run: |
          python -m pytest \
            tests/test_independent_differential.py \
            tests/test_golden_dataset_validation.py \
            tests/test_property_invariants.py \
            tests/test_unit_conversions_exhaustive.py \
            tests/test_battery_gwp_horizons_regulatory.py \
            -v --tb=long
        timeout-minutes: 10

      - name: Run security regression tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SEED_ADMIN: "false"
        run: |
          python -m pytest \
            tests/test_api_security.py \
            tests/test_deep_injection_matrix.py \
            tests/test_it_role_security.py \
            tests/test_security_hardening.py \
            -v --tb=long
        timeout-minutes: 10

      - name: Run independent validation model (validation/)
        working-directory: .
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SEED_ADMIN: "false"
        run: python -m pytest validation -q --tb=short
        timeout-minutes: 5

      - name: Run production smoke tests
        env:
          FLASK_ENV: testing
          SECRET_KEY: "ci-test-secret-key-not-for-production"
          SEED_ADMIN: "false"
        run: |
          python -m pytest \
            tests/test_production_smoke.py \
            -v --tb=long
        timeout-minutes: 5

      - name: Dependency vulnerability audit
        # Fails the build on a known vulnerability (it used to end in `|| true` and never failed).
        run: |
          pip install pip-audit
          pip-audit --requirement requirements.txt --ignore-vuln PYSEC-2022-42969

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 2: Frontend Build
  # Only runs after backend-tests passes. On PRs this validates the build.
  # On main/master it also prepares the GitHub Pages artifact.
  # ─────────────────────────────────────────────────────────────────────────────
  build:
    name: Build Frontend
    runs-on: ubuntu-latest
    needs: backend-tests        # ← Frontend BLOCKED until backend tests pass
    defaults:
      run:
        working-directory: new/client

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'
          cache-dependency-path: new/client/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Dependency vulnerability audit
        run: npm audit --omit=dev --audit-level=high

      - name: Lint
        run: npm run lint

      - name: No new JavaScript sources (TypeScript only)
        run: npm run check:ts

      - name: Lint design-system CSS
        run: npm run lint:css

      - name: UI metrics ratchet
        run: npm run ui:metrics -- --check

      - name: Run frontend unit tests
        run: npm run test


      - name: Determine Base Path and Build
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL || secrets.VITE_API_URL || 'https://ghg-accounting.onrender.com/api' }}
        run: |
          REPO_NAME="${{ github.event.repository.name }}"
          if [[ "$REPO_NAME" == *.github.io ]]; then
            export VITE_BASE_PATH="/"
          else
            export VITE_BASE_PATH="/${REPO_NAME}/"
          fi
          echo "Building with VITE_BASE_PATH=$VITE_BASE_PATH"
          echo "Building with VITE_API_URL=$VITE_API_URL"
          npm run build

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: new/client/dist

  # ─────────────────────────────────────────────────────────────────────────────
  # JOB 3: Deploy to GitHub Pages
  # Only runs on main/master after a successful build.
  # ─────────────────────────────────────────────────────────────────────────────
  deploy:
    name: Deploy to GitHub Pages
    permissions:
      pages: write
      id-token: write
    concurrency:
      group: "pages"
      cancel-in-progress: false
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    needs: build
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master'
    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
