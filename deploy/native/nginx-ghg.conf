# nginx site for the GHG platform: serves the web app and proxies /api to gunicorn on the same origin.
# Replace ghg.example.local and the certificate paths (install.sh does not touch an existing file).

server {
    listen 80;
    server_name ghg.example.local;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl;
    server_name ghg.example.local;

    ssl_certificate     /etc/ssl/ghg/fullchain.pem;
    ssl_certificate_key /etc/ssl/ghg/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;

    # Same size as MAX_CONTENT_LENGTH in /etc/ghg/ghg.env (50 MB default).
    client_max_body_size 50m;

    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "same-origin" always;
    add_header Content-Security-Policy "default-src 'self'; script-src 'self' 'sha256-__INLINE_SCRIPT_HASH__'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' https://fonts.gstatic.com data:; img-src 'self' data: blob:; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'; form-action 'self'" always;

    root /opt/ghg/web;
    index index.html;

    location /api/ {
        proxy_pass http://127.0.0.1:5000;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 120s;
    }

    # Built files have hashed names: cache them. index.html must not be cached.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        add_header X-Content-Type-Options "nosniff" always;
    }

    # Deep links (for example /dashboard) fall back to the single-page app.
    location / {
        try_files $uri /index.html;
        add_header Cache-Control "no-cache";
        add_header X-Content-Type-Options "nosniff" always;
    }
}
