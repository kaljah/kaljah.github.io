# Neocarbon on one server: PostgreSQL, Redis, the API (gunicorn) and nginx.
#   cp .env.example .env    # then fill it in
#   docker compose up -d
# Images come from `docker load -i images/neocarbon-images.tar` (release bundle); in the source
# repository, `docker compose build` builds them.
# Full guide: docs/deployment.md

name: neocarbon

x-app-env: &app-env
  FLASK_ENV: production
  DB_TYPE: postgres
  DATABASE_URL: postgresql://${POSTGRES_USER:-neocarbon}:${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}@db:5432/${POSTGRES_DB:-neocarbon}
  REDIS_URL: redis://redis:6379/0
  SECRET_KEY: ${SECRET_KEY:?set SECRET_KEY in .env}
  ALLOWED_ORIGINS: https://${SERVER_NAME:?set SERVER_NAME in .env}
  # nginx is the one proxy in front of the app
  TRUSTED_PROXIES: "1"
  UPLOAD_JOB_DIR: /data/upload_jobs
  # empty: logs go to `docker compose logs` only
  LOG_FILE: ${LOG_FILE:-}
  BACKUP_DIR: /data/backups
  BACKUP_RETAIN_COUNT: ${BACKUP_RETAIN_COUNT:-14}
  MAX_CONTENT_LENGTH: ${MAX_CONTENT_LENGTH:-52428800}
  MAX_CONCURRENT_UPLOADS_PER_USER: ${MAX_CONCURRENT_UPLOADS_PER_USER:-3}
  LOGIN_RATE_LIMIT: ${LOGIN_RATE_LIMIT:-50 per 15 minutes}
  LOGIN_ACCOUNT_LIMIT: ${LOGIN_ACCOUNT_LIMIT:-10 per 15 minutes}
  MAP_TILE_URL: ${MAP_TILE_URL:-}
  MAP_TILE_ATTRIBUTION: ${MAP_TILE_ATTRIBUTION:-}
  MAP_TILE_SUBDOMAINS: ${MAP_TILE_SUBDOMAINS:-}
  DISABLE_OUTBOUND_EMAIL: ${DISABLE_OUTBOUND_EMAIL:-true}
  SMTP_HOST: ${SMTP_HOST:-}
  SMTP_PORT: ${SMTP_PORT:-587}
  SMTP_USER: ${SMTP_USER:-}
  SMTP_PASSWORD: ${SMTP_PASSWORD:-}
  SMTP_USE_TLS: ${SMTP_USE_TLS:-true}
  EMAIL_FROM: ${EMAIL_FROM:-}
  ADMIN_EMAIL: ${ADMIN_EMAIL:-}
  ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
  ADMIN_FULL_NAME: ${ADMIN_FULL_NAME:-System Administrator}
  IT_ADMIN_EMAIL: ${IT_ADMIN_EMAIL:-}
  IT_ADMIN_PASSWORD: ${IT_ADMIN_PASSWORD:-}
  IT_ADMIN_FULL_NAME: ${IT_ADMIN_FULL_NAME:-IT Administrator}
  GUNICORN_WORKERS: ${GUNICORN_WORKERS:-4}
  GUNICORN_THREADS: ${GUNICORN_THREADS:-4}
  GUNICORN_TIMEOUT: ${GUNICORN_TIMEOUT:-300}
  RATELIMIT_DEFAULT: ${RATELIMIT_DEFAULT:-200 per minute}
  WTF_CSRF_SSL_STRICT: ${WTF_CSRF_SSL_STRICT:-true}

services:
  db:
    image: ${REGISTRY:-docker.io/library}/postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-neocarbon}
      POSTGRES_USER: ${POSTGRES_USER:-neocarbon}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?set POSTGRES_PASSWORD in .env}
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    image: ${REGISTRY:-docker.io/library}/redis:7-alpine
    restart: unless-stopped
    # Sign-in and request rate-limit counters only: nothing to persist.
    command: ["redis-server", "--save", "", "--appendonly", "no"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10

  app:
    image: neocarbon-app:${NEOCARBON_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: app
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    environment: *app-env
    volumes:
      - appdata:/data
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy

  web:
    image: neocarbon-web:${NEOCARBON_VERSION:-latest}
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      target: web
      args:
        REGISTRY: ${REGISTRY:-docker.io/library}
    restart: unless-stopped
    environment:
      SERVER_NAME: ${SERVER_NAME:?set SERVER_NAME in .env}
      CSP_IMG_SRC_EXTRA: ${CSP_IMG_SRC_EXTRA:-}
      CLIENT_MAX_BODY: ${CLIENT_MAX_BODY:-55m}
    ports:
      - "${HTTP_PORT:-80}:80"
      - "${HTTPS_PORT:-443}:443"
    volumes:
      # fullchain.pem and privkey.pem
      - ${TLS_DIR:-./certs}:/etc/nginx/certs:ro
    depends_on:
      app:
        condition: service_healthy

volumes:
  pgdata:
  appdata:
